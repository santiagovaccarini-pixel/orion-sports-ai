name: Orion frontend tests

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches:
      - cloud-prototype
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".github/workflows/frontend-tests.yml"

permissions:
  contents: read

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # .npmrc keeps audit=false so the hardened, network-bounded installer in
      # scripts/install-ci.sh stays deterministic. Auditing as its own step
      # surfaces vulnerable dependencies without touching that install path.
      # Reported, not enforced: a new advisory should not block an unrelated
      # change, but it must be visible instead of silently suppressed.
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build and run frontend tests
        run: npm test
