name: Orion backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - cloud-prototype
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests

      - name: Run backend unit tests
        env:
          ORION_MODEL_PROVIDER: ollama
          ORION_WEB_ENABLED: "false"
          ORION_SEMANTIC_ORCHESTRATION: "false"
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s backend/tests -p "test_*.py" -v 2>&1 | tee backend-test.log

      - name: Upload backend failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend-test.log
          if-no-files-found: ignore
          retention-days: 3
