name: Backend tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend regression suite
        env:
          ORION_WEB_ENABLED: "false"
          ORION_SEMANTIC_PLANNER_ENABLED: "false"
          ORION_DEEP_THINKING_ENABLED: "false"
        run: python -m unittest discover -s backend/tests -v
