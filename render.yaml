services:
  - type: web
    name: orion-core-prototype
    runtime: python
    plan: free
    region: virginia
    branch: cloud-prototype
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      # Cerebras serves the same gpt-oss-120b weights: same answers, measured 12x
      # faster end to end, and without Workers AI's ~8-queries-a-day free ceiling.
      # Rolling back is this one value; the Cloudflare credentials stay below.
      - key: ORION_MODEL_PROVIDER
        value: cerebras
      - key: ORION_CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: ORION_CLOUDFLARE_API_TOKEN
        sync: false
      - key: ORION_API_KEY
        sync: false
      # Neon Postgres. Set in the Render dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      - key: ORION_CLOUDFLARE_QUICK_MODEL
        value: "@cf/openai/gpt-oss-120b"
      - key: ORION_CLOUDFLARE_DEEP_MODEL
        value: "@cf/openai/gpt-oss-120b"
      - key: ORION_CLOUDFLARE_QUICK_REASONING_EFFORT
        value: "low"
      - key: ORION_CLOUDFLARE_DEEP_REASONING_EFFORT
        value: "medium"
      - key: ORION_CLOUDFLARE_QUICK_MAX_TOKENS
        value: "1536"
      - key: ORION_CLOUDFLARE_DEEP_MAX_TOKENS
        value: "3072"
      # Cerebras and Groq serve the same gpt-oss weights an order of magnitude
      # faster than Workers AI. Each keeps its own key so more than one can stay
      # configured; the switch (and the rollback) is ORION_MODEL_PROVIDER above,
      # with Cloudflare still credentialed underneath. The base URL and model id
      # come from that provider's defaults, so neither is repeated here.
      - key: ORION_CEREBRAS_API_KEY
        sync: false
      - key: ORION_GROQ_API_KEY
        sync: false
      - key: ORION_ENDPOINT_QUICK_REASONING_EFFORT
        value: "low"
      - key: ORION_ENDPOINT_DEEP_REASONING_EFFORT
        value: "medium"
      - key: ORION_WEB_ENABLED
        value: "true"
      - key: ORION_WEB_PROVIDER
        value: "auto"
      - key: ORION_TAVILY_API_KEY
        sync: false
      - key: ORION_WEB_MINIMUM_SOURCES
        value: "3"
      # Ranking memory and document chunks by meaning. Uses the Cloudflare
      # credentials already configured below, on a model inside the free
      # allowance; if either is missing, or the call is slow, both fall back to
      # the previous behaviour, so this can be turned off with one value.
      - key: ORION_EMBEDDINGS_ENABLED
        value: "true"
      - key: ORION_SEMANTIC_ORCHESTRATION
        value: "true"
      - key: ORION_SEMANTIC_MAX_TOOL_ROUNDS
        value: "3"
      - key: ORION_DIAGNOSTICS_ENABLED
        value: "true"
