services:
  - type: web
    name: orion-core-prototype
    runtime: python
    plan: free
    region: virginia
    branch: cloud-prototype
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ORION_MODEL_PROVIDER
        value: cloudflare
      - key: ORION_CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: ORION_CLOUDFLARE_API_TOKEN
        sync: false
      - key: ORION_API_KEY
        sync: false
      # Neon Postgres. Set in the Render dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      - key: ORION_CLOUDFLARE_QUICK_MODEL
        value: "@cf/openai/gpt-oss-120b"
      - key: ORION_CLOUDFLARE_DEEP_MODEL
        value: "@cf/openai/gpt-oss-120b"
      - key: ORION_CLOUDFLARE_QUICK_REASONING_EFFORT
        value: "low"
      - key: ORION_CLOUDFLARE_DEEP_REASONING_EFFORT
        value: "medium"
      - key: ORION_CLOUDFLARE_QUICK_MAX_TOKENS
        value: "1536"
      - key: ORION_CLOUDFLARE_DEEP_MAX_TOKENS
        value: "3072"
      # Groq serves the same gpt-oss weights an order of magnitude faster. The
      # switch is ORION_MODEL_PROVIDER above; these values stay inert until then,
      # so the Cloudflare credentials remain a working fallback.
      - key: ORION_GROQ_API_KEY
        sync: false
      - key: ORION_GROQ_QUICK_MODEL
        value: "openai/gpt-oss-120b"
      - key: ORION_GROQ_DEEP_MODEL
        value: "openai/gpt-oss-120b"
      - key: ORION_GROQ_QUICK_REASONING_EFFORT
        value: "low"
      - key: ORION_GROQ_DEEP_REASONING_EFFORT
        value: "medium"
      - key: ORION_WEB_ENABLED
        value: "true"
      - key: ORION_WEB_PROVIDER
        value: "auto"
      - key: ORION_TAVILY_API_KEY
        sync: false
      - key: ORION_WEB_MINIMUM_SOURCES
        value: "3"
      - key: ORION_SEMANTIC_ORCHESTRATION
        value: "true"
      - key: ORION_SEMANTIC_MAX_TOOL_ROUNDS
        value: "3"
      - key: ORION_DIAGNOSTICS_ENABLED
        value: "true"
